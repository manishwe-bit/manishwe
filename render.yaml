# Backend: FastAPI on Render (free plan). Create via Render > New > Blueprint.
services:
  - type: web
    name: manish-kaiwarty-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: portfolio
      - key: ALLOWED_ORIGINS
        value: https://manish-kaiwarty.netlify.app,http://localhost:5173
      - key: ADMIN_KEY
        generateValue: true
