# Render blueprint: the whole site (React + FastAPI) as ONE free web service, built from the root Dockerfile.
# One click: the "Deploy to Render" button in README.md, or Render > New > Blueprint > this repo.
# Every push to GitHub redeploys automatically.
services:
  - type: web
    name: manish-kaiwarty
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Optional: MongoDB Atlas connection string. Empty = enquiries kept in memory (lost on restart).
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: portfolio
      # Password for the dashboard at /#/admin (Render generates it; copy it from the Environment tab).
      - key: ADMIN_KEY
        generateValue: true
      # Contact form -> your inbox (free key from resend.com, sign up with NOTIFY_EMAIL).
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFY_EMAIL
        value: manishkaiwarty@gmail.com
      # MK-01 robot + AI website generator (key from console.anthropic.com).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHAT_DAILY_CAP
        value: "400"
