# Optional: host only the React frontend on Netlify (the Render service already serves the whole site by itself).
# Netlify builds frontend/. It has no /api of its own, so the site talks to the Render service directly:
# frontend/src/config.js points any *.netlify.app address at https://manish-kaiwarty.onrender.com, and the API
# allows the Netlify origin (backend/app/net.py). No proxy rule or environment variable is needed.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
