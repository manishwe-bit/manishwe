# Frontend: built from frontend/ and served by Netlify.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Forward API calls to the FastAPI backend on Render (same origin for the browser, no CORS needed).
# Replace the host if your Render service gets a different URL.
[[redirects]]
  from = "/api/*"
  to = "https://manish-kaiwarty-api.onrender.com/api/:splat"
  status = 200
  force = true
