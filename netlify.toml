# Optional: host only the React frontend on Netlify (the Render service already serves the whole site by itself).
# Netlify builds frontend/ and the browser talks to the API directly, so no proxy rule is needed here.
#
# In Netlify: Site configuration > Environment variables, add
#   VITE_API_URL = https://<your-render-service>.onrender.com     (no trailing slash)
# The live-cursor WebSocket address is derived from it automatically.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
